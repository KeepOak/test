name: Beta desktop update
# Every accepted integration commit can become an opt-in beta. A single running publisher and
# one pending run coalesce bursts; old commits are skipped, never shipped after a newer tip.
on:
  push:
    branches: [mac/cross-platform]
  workflow_dispatch:
permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
  statuses: read
concurrency:
  group: beta-desktop-publisher
  cancel-in-progress: false
jobs:
  gate:
    if: (github.repository == 'stabrea/Branch-Agent' || github.repository == 'KeepOak/Branch-Agent') && github.ref == 'refs/heads/mac/cross-platform'
    runs-on: ubuntu-latest
    timeout-minutes: 100
    outputs:
      ready: ${{ steps.prove.outputs.ready }}
      tag: ${{ steps.plan.outputs.tag }}
      version: ${{ steps.plan.outputs.version }}
      acceptance_kind: ${{ steps.prove.outputs.acceptance_kind }}
      acceptance_run: ${{ steps.prove.outputs.acceptance_run }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - id: plan
        env:
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          plan="$(node scripts/beta-release.mjs plan "$RUN_NUMBER")"
          echo "tag=$(printf '%s' "$plan" | jq -r .tag)" >> "$GITHUB_OUTPUT"
          echo "version=$(printf '%s' "$plan" | jq -r .version)" >> "$GITHUB_OUTPUT"
      - name: Require the newest trusted exact-commit Checks result
        id: prove
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
        run: |
          tip="$(gh api "repos/$GH_REPO/git/ref/heads/mac/cross-platform" --jq .object.sha)"
          if [ "$tip" != "$SOURCE_SHA" ]; then
            echo "Newer integration tip $tip supersedes $SOURCE_SHA; no beta build."
            exit 0
          fi
          # Fast beta is only for an exact merged PR with an independent exact-head approval and
          # the newest exact-head PR Fast Checks green. Anything unverifiable falls back to full CI.
          if node scripts/beta-release.mjs fast-proof "$SOURCE_SHA" "$GH_REPO" > "$RUNNER_TEMP/beta-fast.json"; then
            run="$(jq -r .run.id "$RUNNER_TEMP/beta-fast.json")"
            echo "ready=true" >> "$GITHUB_OUTPUT"
            echo "acceptance_kind=reviewed-fast" >> "$GITHUB_OUTPUT"
            echo "acceptance_run=$run" >> "$GITHUB_OUTPUT"
            echo "Accepted reviewed PR and exact PR Fast Checks run $run."
            exit 0
          fi
          for attempt in $(seq 1 180); do
            tip="$(gh api "repos/$GH_REPO/git/ref/heads/mac/cross-platform" --jq .object.sha)"
            if [ "$tip" != "$SOURCE_SHA" ]; then
              echo "Newer integration tip $tip supersedes $SOURCE_SHA; no beta build."
              exit 0
            fi
            runs="$(gh api --method GET "repos/$GH_REPO/actions/workflows/checks.yml/runs" \
              -f head_sha="$SOURCE_SHA" -f per_page=100)"
            if printf '%s' "$runs" | node scripts/beta-release.mjs gate "$SOURCE_SHA" "$GH_REPO" > "$RUNNER_TEMP/beta-checks.json"; then
              run="$(jq -r .id "$RUNNER_TEMP/beta-checks.json")"
              echo "ready=true" >> "$GITHUB_OUTPUT"
              echo "acceptance_kind=exhaustive" >> "$GITHUB_OUTPUT"
              echo "acceptance_run=$run" >> "$GITHUB_OUTPUT"
              echo "Accepted exact integration Checks run $run."
              exit 0
            else
              code=$?
              if [ "$code" -eq 1 ]; then
                echo "::error::Newest trusted Checks run is red; beta was not built."
                exit 1
              fi
              if [ "$code" -ne 2 ]; then exit "$code"; fi
            fi
            echo "No completed trusted Checks result yet ($attempt/180)."
            sleep 30
          done
          echo "::error::No successful exact integration Checks result within 90 minutes."
          exit 1
  build:
    needs: gate
    if: needs.gate.outputs.ready == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      BETA_VERSION: ${{ needs.gate.outputs.version }}
      HAS_APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12 != '' }}
      HAS_NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
      HAS_MAC_SIGNING_CERTIFICATE: ${{ secrets.MAC_SIGNING_P12_BASE64 != '' && secrets.MAC_SIGNING_SHA1 != '' }}
      HAS_APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY != '' }}
      MAC_SIGNING_REQUIRED: ${{ vars.MAC_SIGNING_REQUIRED == 'true' }}
      HAS_ANY_MAC_SIGNING_SECRET: ${{ secrets.MAC_SIGNING_P12_BASE64 != '' || secrets.MAC_SIGNING_P12_PASSWORD != '' || secrets.MAC_SIGNING_SHA1 != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      # This explicit packaging-only transform gives the archive exactly the prerelease tag's
      # version. The committed integration tree remains untouched and is identified in provenance.
      - run: node scripts/beta-release.mjs stamp "$BETA_VERSION"
        shell: bash
      - if: runner.os == 'macOS' && env.HAS_APPLE_CERTIFICATE == 'true'
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/cert.p12" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security list-keychain -d user -s "$keychain"
          rm -f "$RUNNER_TEMP/cert.p12"
      - name: Refuse missing required Mac signing
        if: runner.os == 'macOS' && env.MAC_SIGNING_REQUIRED == 'true' && env.HAS_MAC_SIGNING_CERTIFICATE != 'true' && !(env.HAS_APPLE_CERTIFICATE == 'true' && env.HAS_APPLE_SIGNING_IDENTITY == 'true')
        run: |
          echo "::error::Required Mac signing certificate is missing; no beta will be published."
          exit 1
      - name: Refuse half-configured Mac signing
        if: runner.os == 'macOS' && env.MAC_SIGNING_REQUIRED != 'true' && env.HAS_ANY_MAC_SIGNING_SECRET == 'true'
        run: |
          echo "::error::MAC_SIGNING_* is set without MAC_SIGNING_REQUIRED; no beta will be published."
          exit 1
      - name: Warn for unsigned Mac beta
        if: runner.os == 'macOS' && env.MAC_SIGNING_REQUIRED != 'true' && env.HAS_ANY_MAC_SIGNING_SECRET != 'true'
        run: echo "::warning::Mac beta is unsigned and may ask for permissions again after an update."
      - name: Load Mac signing certificate
        if: runner.os == 'macOS' && env.HAS_MAC_SIGNING_CERTIFICATE == 'true'
        env:
          MAC_SIGNING_P12_BASE64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          MAC_SIGNING_P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/branch-signing.keychain-db"
          keychain_password="$(uuidgen)"
          printf '%s' "$MAC_SIGNING_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/branch-signing.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/branch-signing.p12" -k "$keychain" -P "$MAC_SIGNING_P12_PASSWORD" -T /usr/bin/codesign -f pkcs12 >/dev/null
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d ' "')
          rm -f "$RUNNER_TEMP/branch-signing.p12"
          echo "MAC_SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
      - if: runner.os == 'macOS' && env.HAS_NOTARY_KEY == 'true'
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: printf '%s' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/notary-key.p8"
      - name: Build beta desktop archive
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          MAC_SIGNING_SHA1: ${{ secrets.MAC_SIGNING_SHA1 }}
        run: |
          if [ -f "$RUNNER_TEMP/notary-key.p8" ]; then export APPLE_API_KEY_PATH="$RUNNER_TEMP/notary-key.p8"; fi
          npm run package:desktop -- --release
          if [ "$RUNNER_OS" = "macOS" ]; then node scripts/package-desktop.mjs --release --arch x64; fi
      - name: Smoke the exact packaged merge source
        env:
          BRANCH_PROVIDER: demo
        run: |
          node dist/cli.js run "Write, read and verify the fixture file."
          node --test tests/beta-release.test.mjs tests/packaging.test.mjs
      - name: Remove Mac signing material
        if: always() && runner.os == 'macOS'
        run: |
          rm -f "$RUNNER_TEMP/notary-key.p8" "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/branch-signing.p12"
          if [ -f "$RUNNER_TEMP/signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/signing.keychain-db"; fi
          if [ -f "$RUNNER_TEMP/branch-signing.keychain-db" ]; then security delete-keychain "$RUNNER_TEMP/branch-signing.keychain-db"; fi
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: beta-${{ runner.os }}
          path: |
            release/Branch-Agent-*.zip
            release/Branch-Agent-*.tar.gz
            release/Branch-Agent-*.sha256
          if-no-files-found: error
          # Build hand-off only; release assets are retained on GitHub Releases.
          retention-days: 1
  publish:
    needs: [gate, build]
    if: needs.gate.outputs.ready == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      checks: read
      contents: write
      pull-requests: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: downloads
          merge-multiple: true
      - name: Publish only a complete, still-current beta
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.gate.outputs.tag }}
          SOURCE_SHA: ${{ github.sha }}
          ACCEPTANCE_KIND: ${{ needs.gate.outputs.acceptance_kind }}
          ACCEPTANCE_RUN: ${{ needs.gate.outputs.acceptance_run }}
          PUBLISHER_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node source/scripts/beta-release.mjs publish "$TAG" "$SOURCE_SHA" "$ACCEPTANCE_KIND" "$ACCEPTANCE_RUN" downloads "$PUBLISHER_URL"
