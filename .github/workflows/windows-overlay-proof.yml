name: Windows overlay proof
on:
  pull_request:
    paths:
      - '.github/workflows/windows-overlay-proof.yml'
      - 'src/desktop/window-chrome-ipc.ts'
      - 'public/app/shell/controls.js'
      - 'tests/window-chrome.test.mjs'
      - 'tests/desktop-window.test.mjs'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  overlay-window:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node -e "require('electron')"
      - run: npm run build
      - run: node --test --test-concurrency=1 tests/window-chrome.test.mjs tests/desktop-window.test.mjs
