name: PR Fast Checks
on:
  pull_request:
permissions:
  contents: read
concurrency:
  group: pr-fast-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  verify-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Classify the exact pull-request diff
        id: impact
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/select-affected-tests.mjs --base="$BASE_SHA" --head="$HEAD_SHA" --output=selected-tests.json
      # A broad or uncertain change has no fast selection. It is not held here: the Checks suite runs on every pull
      # request in under fifteen minutes, and its verify-suite job is the required check for the whole suite.
      - name: Leave broad or uncertain changes to the whole suite
        if: steps.impact.outputs.classification == 'full-required'
        run: echo "::notice::This diff is broad, unmapped, renamed/deleted, or above the fast-test budget. The Checks suite (verify-suite) covers it."
      - name: Install locked dependencies
        if: steps.impact.outputs.classification == 'narrow'
        run: npm ci
      - name: Check documentation-only changes
        if: steps.impact.outputs.classification == 'docs-only'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff --check "$BASE_SHA" "$HEAD_SHA"
          node scripts/check-docs.mjs
      - name: Build
        if: steps.impact.outputs.classification == 'narrow'
        run: npm run build
      - name: Install Chromium only when selected tests use it
        if: steps.impact.outputs.classification == 'narrow' && steps.impact.outputs.browser_needed == 'true'
        run: npx playwright install --with-deps chromium --only-shell
      - name: Run selected non-browser tests
        if: steps.impact.outputs.classification == 'narrow' && steps.impact.outputs.browser_needed != 'true'
        run: node scripts/run-tests.mjs --files-from=selected-tests.json
      - name: Run selected browser tests
        if: steps.impact.outputs.classification == 'narrow' && steps.impact.outputs.browser_needed == 'true'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a node scripts/run-tests.mjs --files-from=selected-tests.json
      - name: Record what green means
        if: always()
        env:
          CLASSIFICATION: ${{ steps.impact.outputs.classification }}
          PREDICTED_SECONDS: ${{ steps.impact.outputs.predicted_seconds }}
        run: |
          {
            echo "### PR fast gate"
            echo "- Classification: \`${CLASSIFICATION:-selector-failed}\`"
            echo "- Predicted selected-test time: \`${PREDICTED_SECONDS:-unknown}s\`"
            echo "- Execution ceiling: 5 minutes after a runner starts"
            echo "- The whole suite runs in Checks (verify-suite) on every pull request"
            echo "- Hosted-runner queue time is outside this ceiling"
          } >> "$GITHUB_STEP_SUMMARY"
