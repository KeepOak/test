name: Phone apps
# Builds the iPhone and Android apps and keeps the files for seven days. It never publishes: no
# App Store, TestFlight, Play Store, F-Droid or GitHub release. See docs/configuration.md, "Phone apps".
# Built for a release tag and by hand only: the phone builds took hosted macOS time on pull requests, and CI has to
# finish in under fifteen minutes. The phone app's own rules, shell and contract tests run in the main suite.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      owner_test:
        description: Build only the installable Android owner test (separate app, disposable debug key)
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  android:
    if: ${{ !inputs.owner_test }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      BRANCH_MOBILE_BUILD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Use the runner's Java 21 (Capacitor 8 needs it)
        shell: bash
        run: |
          java_home="${JAVA_HOME_21_X64:-${JAVA_HOME_21_arm64:-}}"
          test -n "$java_home"
          echo "JAVA_HOME=$java_home" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm ci --no-audit --no-fund
        working-directory: apps/mobile
      # Pull-request code is never given the release key. Signing happens only in package.yml
      # after the exact tagged commit passes its release gate.
      - name: Build the Android app (unsigned)
        run: node scripts/package-mobile.mjs --android
      # The Java tests in app/src/test, and the push code (app/src/push) that the ordinary build leaves out.
      - name: Run the Android unit tests
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon testReleaseUnitTest
      - name: Compile the Android push code (not kept)
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon -PbranchPushCompile compileReleaseJavaWithJavac
      - name: Check the phone app
        run: node --test --test-concurrency=1 tests/mobile-rules.test.mjs tests/mobile-shell.test.mjs tests/mobile-contract.test.mjs tests/mobile-build.test.mjs
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-${{ runner.os }}
          path: |
            release/mobile/Branch-Agent-android.*
          if-no-files-found: error
          retention-days: 7
  ios:
    if: ${{ !inputs.owner_test }}
    runs-on: macos-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm ci --no-audit --no-fund
        working-directory: apps/mobile
      - name: Build the iPhone app (unsigned) and the Simulator build
        run: node scripts/package-mobile.mjs --ios
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ios
          path: |
            release/mobile/Branch-Agent-ios*
          if-no-files-found: error
          retention-days: 7
  android-owner-test:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.owner_test }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - name: Use the runner's Java 21
        run: echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npm ci --no-audit --no-fund
        working-directory: apps/mobile
      - name: Prepare the phone files without reading any release key
        run: node --input-type=module -e 'import { prepare } from "./scripts/package-mobile.mjs"; await prepare();'
      - name: Build and test the separate debug app
        working-directory: apps/mobile/android
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest
      - name: Verify the test signature and record the exact source
        shell: bash
        run: |
          apk=apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk
          tools=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$tools/apksigner" verify "$apk"
          sha256sum "$apk" > "$apk.sha256"
          printf '%s\n' "$GITHUB_SHA" > "$apk.source-sha.txt"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-owner-test-${{ github.sha }}
          path: apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk*
          if-no-files-found: error
          retention-days: 7
