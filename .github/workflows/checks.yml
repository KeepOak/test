name: Checks
# Two faults, one rule. Pushing every branch at once once started a run on all 216 of them,
# including agent worktree branches from months ago that were never meant to build: six failed in
# the same minute for reasons that had nothing to do with anyone's work, and the queue they made
# delayed the release that did. And a branch with a pull request was being checked twice, on the
# push and again on the request, which on a shared runner is slow enough to fail tests that wait on
# a clock.
#
# So: integration pushes and a nightly rehearsal run the exhaustive three-system suite. Pull
# requests use pr-fast.yml, which either runs a reviewed affected-test set within five minutes or
# refuses to go green until this exhaustive workflow passes for the exact same commit.
on:
  push:
    branches: [main, wave2/integration, 'release/**', 'mac/**', 'mac2/**', 'mac5/**', 'mac6/**', 'mac7/**', 'wave9/**']
  workflow_dispatch:
    inputs:
      own_computers:
        description: Use the owner's computers (auto asks which of their runners are idle; on uses them all; off uses GitHub's)
        type: choice
        options: [auto, 'on', 'off']
        default: auto
      windows_screens:
        description: Run the browser-screen tests on Windows and macOS too (auto does on the trunks and at night, and leaves them to Linux on trains)
        type: choice
        options: [auto, 'on', 'off']
        default: auto
  schedule:
    - cron: '17 3 * * *'
permissions:
  contents: read
# One run per branch. A newer manual/development run replaces an older run, except on
# the two integration trunks where every commit may be released and therefore needs its own result.
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/mac/cross-platform' }}
# Where the time went (run 35382268151, before this change): Windows took 70.7 minutes, and 63 of
# them were the test files running three at a time on one machine; macOS and Linux did the same in
# about 20. So the tests are split into shares that run on separate machines at once (`--shard`,
# packed by measured time from tests/test-weights.json), and the packaging runs beside them rather
# than after them. Nothing is skipped in this workflow: `verify` is red unless every share on every
# system and every packaging job are green.
jobs:
  # Which machines take this run. The owner's own computers are used when their runners are online and idle,
  # and GitHub's otherwise, so a run never waits for a computer that is off or busy. Windows goes to the
  # Legion PC's runners (label branch-legion) and macOS to the Mac mini's (branch-macmini), except the desktop and uninstall tests, which never run on
  # the owner's own computer and go to one hosted Windows share. Listing runners needs a token that can read
  # the repository's administration (RUNNER_STATUS_TOKEN); without it, or asked with own_computers, the
  # choice is made by hand. Windows goes to the Legion PC only when asked (own_computers: on), and to ten of
  # GitHub's Windows machines otherwise. Measured on 2026-09-24: six shares on the Legion PC did not finish inside
  # the 60-minute limit, and six on GitHub's took 40 to 60 minutes each, one of them past the limit.
  pick:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ secrets.RUNNER_STATUS_TOKEN }}
          REPO: ${{ github.repository }}
          ASKED: ${{ inputs.own_computers || 'auto' }}
          SCREENS_ASKED: ${{ inputs.windows_screens || 'auto' }}
        run: |
          idle() {
            case "$ASKED" in
              on) echo "$2" ;;
              auto) if [ -n "$GH_TOKEN" ]; then
                  gh api "repos/$REPO/actions/runners" --jq "[.runners[] | select(.status == \"online\" and (.busy | not) and ([.labels[].name] | index(\"$1\")))] | length" || echo 0
                else echo 0; fi ;;
              *) echo 0 ;;
            esac
          }
          # The browser-screen files are 166 of Windows' 258 machine-minutes and 71 of macOS' 86, one at a time; Linux
          # runs every one of them on every run. So a train's Windows and macOS shares leave them out, and the
          # integration trunk and the nightly run still put all of them through all three systems before a release.
          screens() {
            case "$SCREENS_ASKED" in
              on|off) echo "$SCREENS_ASKED" ;;
              *) case "$GITHUB_REF" in refs/heads/main|refs/heads/mac/cross-platform) echo on ;; *) [ "$GITHUB_EVENT_NAME" = schedule ] && echo on || echo off ;; esac ;;
            esac
          }
          node -e '
            const [legion, macmini, wsl] = process.argv.slice(1, 4).map(Number), screens = process.argv[4], keepOff = process.argv[5], rows = [];
            const windows = screens === "off" ? { groups: "shared,desktop" } : {}, mac = windows;
            const add = (os, labels, total, extra = {}) => { for (let shard = 1; shard <= total; shard++) rows.push({ os, labels, shard, total, ...extra }); };
            // One of the owner computers: never the desktop or uninstall tests, which take one hosted share of their own.
            const own = (os, label, idle, hosted, spare, extra = {}) => {
              add(os, ["self-hosted", label], idle, { own: label, exclude: keepOff, concurrency: spare, ...extra });
              rows.push({ os, labels: hosted, shard: 1, total: 1, only: keepOff, ...extra });
            };
            // With Linux on the Legion PC WSL runners, GitHub machines left over (about 20 at once) take more Windows shares.
            if (legion > 0) own("windows", "branch-legion", legion, "windows-latest", "4,1", windows);
            else add("windows", "windows-latest", wsl > 0 && screens === "off" ? 12 : 10, windows);
            if (macmini > 0) own("macos", "branch-macmini", macmini, "macos-latest", "4,2", mac);
            else add("macos", "macos-latest", screens === "off" ? 2 : 5, mac);
            // Linux goes to the Legion PC WSL runners (label branch-wsl, a separate distro with no Windows drive) only when
            // asked (own_computers: on). Measured on 2026-09-24: four shares there took 25 minutes against 13 to 18 on eight of
            // GitHub machines, and running more files at once there shook out order and timing flakes.
            if (wsl > 0) own("linux", "branch-wsl", wsl, "ubuntu-latest", "6,2"); else add("linux", "ubuntu-latest", 8);
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, "matrix=" + JSON.stringify({ include: rows }) + "\n");
            console.log(`Windows on ${legion || "no"} Legion runner(s) (screens ${screens}), macOS on ${macmini || "no"} Mac mini runner(s), Linux on ${wsl || "no"} WSL runner(s); ${rows.length} shares.`);
          ' "$( [ "$ASKED" = on ] && idle branch-legion 6 || echo 0 )" "$(idle branch-macmini 2)" "$( [ "$ASKED" = on ] && idle branch-wsl 4 || echo 0 )" "$(screens)" '^tests/(desktop[^/]*|[^/]*uninstall[^/]*|windows-hidden[^/]*|[^/]*console[^/]*)\.test\.mjs$'
  test:
    name: test (${{ matrix.os }}${{ matrix.own && format(' on {0}', matrix.own) || '' }}${{ matrix.only && ' desktop' || '' }}, ${{ matrix.shard }}/${{ matrix.total }})
    needs: pick
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.pick.outputs.matrix) }}
    runs-on: ${{ matrix.labels }}
    # A share takes 20 to 45 minutes on Windows. A test that leaves a process behind once kept a share waiting
    # 78 minutes for a file that would never finish; the default limit is six hours.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # '24' is the newest Node 24, which is above the floor in src/node-floor.ts (24.14.0). The
      # floor itself is held by a test in tests/comfort.test.mjs, not by pinning a patch here.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      # Never on the owner's own computers: installing a Python there replaces the owner's own copy of the same
      # version (it once removed python.exe from the Legion PC's Python 3.12). They already have Python.
      - if: ${{ !matrix.own }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci
      # Downloading the browser took 3.2 minutes of every Windows run. The download is kept between
      # runs, keyed on the Playwright version in the lockfile and on what is installed, so a new
      # version or a different browser starts a new copy. The install still runs every time: with the
      # browser already there it only checks it (Playwright marks a copy complete only once the whole
      # download landed, so a partial one is fetched again rather than used), and on Linux it also
      # puts in the system libraries, which are not in the kept folder. Nothing is restored from an
      # older key, so a copy from another version is never used.
      - id: playwright
        shell: bash
        run: echo "version=$(node -p "require('playwright/package.json').version")" >> "$GITHUB_OUTPUT"
      # Every share gets the browser, even one without the browser files: some ordinary files drive a real browser
      # through Branch's own browser tool (tests/comfort.test.mjs), which the file grouping cannot see.
      - if: ${{ !matrix.own }}
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/AppData/Local/ms-playwright
            ~/Library/Caches/ms-playwright
            ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}-chromium-headless-shell
      # The owner's computers already have the browser's system libraries, and their runner users have no sudo.
      - run: npx playwright install ${{ !matrix.own && '--with-deps' || '' }} chromium --only-shell
      # Ubuntu 24.04 turns off unprivileged user namespaces, which is what Electron's own sandbox is
      # built on, so every desktop test died with "Process failed to launch!" before reaching a
      # single assertion. This relaxes it on the build machine only. The app is not changed: the
      # alternative going around is passing --no-sandbox to Electron, which would mean shipping a
      # weaker sandbox to everyone in order to make a test pass here.
      - if: runner.os == 'Linux' && !matrix.own
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Linux has no screen on the runner; Electron tests draw into a virtual one.
      - if: runner.os == 'Linux'
        run: xvfb-run -a npm test -- --shard=${{ matrix.shard }}/${{ matrix.total }}
        env:
          BRANCH_TEST_TIMINGS: ${{ runner.temp }}/test-timings.json
          BRANCH_TEST_GROUPS: ${{ matrix.groups }}
          BRANCH_TEST_EXCLUDE: ${{ matrix.exclude }}
          BRANCH_TEST_ONLY: ${{ matrix.only }}
          BRANCH_TEST_CONCURRENCY: ${{ matrix.concurrency }}
      - if: runner.os != 'Linux'
        run: npm test -- --shard=${{ matrix.shard }}/${{ matrix.total }}
        env:
          BRANCH_TEST_TIMINGS: ${{ runner.temp }}/test-timings.json
          BRANCH_TEST_GROUPS: ${{ matrix.groups }}
          BRANCH_TEST_EXCLUDE: ${{ matrix.exclude }}
          BRANCH_TEST_ONLY: ${{ matrix.only }}
          BRANCH_TEST_CONCURRENCY: ${{ matrix.concurrency }}
      # How long each file took, so tests/test-weights.json can be refreshed from a real run.
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-timings-${{ runner.os }}-${{ matrix.shard }}
          path: ${{ runner.temp }}/test-timings.json
          if-no-files-found: ignore
          retention-days: 14
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: npm ci
      - run: python -m unittest discover -s experiments -p 'test_*.py'
      - run: npm run build
      # One task end to end through the tests' scripted fixture, named explicitly: Branch never offers it.
      - run: node dist/cli.js run "Write, read and verify the fixture file."
        env:
          BRANCH_PROVIDER: demo
      # Every system builds its download; Macs also build the Intel copy from the same runner.
      - run: npm run package:desktop -- --release
      - if: runner.os == 'macOS'
        run: node scripts/package-desktop.mjs --release --arch x64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: download-${{ runner.os }}
          path: |
            release/Branch-Agent-*.zip
            release/Branch-Agent-*.tar.gz
            release/Branch-Agent-*.sha256
            release/Install Branch Agent.cmd
          if-no-files-found: error
          retention-days: 7
  # The one check to wait for, and the name to require if main is protected (it is not today). It runs even when a
  # share fails, so the check is red rather than skipped, and it is green only when every share on
  # every system and every packaging job passed.
  verify:
    needs: [test, package]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every share and every package passed
        env:
          TEST: ${{ needs.test.result }}
          PACKAGE: ${{ needs.package.result }}
        run: |
          echo "tests: $TEST, packaging: $PACKAGE"
          test "$TEST" = success && test "$PACKAGE" = success
