name: Dependency review
# Once a week (and by hand): the advisories that apply to what Branch ships, and what has fallen behind. It never runs
# on a pull request, so it costs the fifteen-minute budget nothing. A high or critical advisory in a shipped dependency
# fails the run, so the owner sees it in the Actions tab.
on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
      - name: What has fallen behind (for reading, never fails)
        run: npm outdated --long || true
      - name: Advisories in what Branch ships
        run: npm audit --omit=dev --audit-level=high
