<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: mediastream:; connect-src 'self'; base-uri 'none'; form-action 'none'" />
    <title>Branch Agent</title>
    <link rel="stylesheet" href="/tokens.css" />
    <link rel="stylesheet" href="/phone.css" />
  </head>
  <body>
    <!-- The phone app's own screens (app.js draws them): one screen, the tab bar, a sheet, a short message line. -->
    <main id="phone">
      <div class="p-body" id="screen"></div>
      <nav class="p-tabs" id="tabs" hidden></nav>
      <div id="sheet"></div>
      <p class="p-toast" id="toast" role="status" hidden></p>
    </main>
    <input id="pick-camera" type="file" accept="image/*" capture="environment" hidden />
    <input id="pick-photos" type="file" accept="image/*" multiple hidden />
    <input id="pick-files" type="file" multiple hidden />
    <script type="module" src="/app.js"></script>
  </body>
</html>
