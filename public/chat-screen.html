<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Branch screen</title><link rel="stylesheet" href="/chat-screen.css"><script defer src="https://telegram.org/js/telegram-web-app.js"></script><script type="module" src="/chat-screen.js"></script></head>
<body><main><header><h1 data-word="title">Your screen</h1><button id="stop" type="button" disabled data-word="stop">Stop</button></header>
<p id="status" role="status" aria-live="polite"></p>
<section id="confirm"><p data-word="confirm">Confirm this session in Settings › Chat apps, or enter your PIN.</p><label><span data-word="pin">PIN</span><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="64"></label><button id="find" type="button" data-word="find">Find application windows</button></section>
<section id="choose" hidden><label><span data-word="target">Application window</span><select id="target"></select></label><button id="start" type="button" data-word="open">Open view</button></section>
<section id="view" hidden><canvas id="screen" role="img" aria-label="Live view of the selected application window"></canvas><div class="controls"><button id="take" type="button" data-word="take">Take over</button><button id="hand" type="button" disabled data-word="hand">Hand back</button></div>
<fieldset id="input" disabled><legend data-word="controls">Control this window</legend><label><span data-word="text">Text to type</span><textarea id="text" maxlength="2000" rows="2" autocomplete="off"></textarea></label><button id="type" type="button" data-word="type">Type text</button><div class="controls"><select id="key" aria-label="Key"><option>Enter</option><option>Tab</option><option>Escape</option><option>Backspace</option><option>Ctrl+A</option><option>Ctrl+C</option><option>Ctrl+V</option><option value="up">ArrowUp</option><option value="down">ArrowDown</option><option value="left">ArrowLeft</option><option value="right">ArrowRight</option></select><button id="press" type="button" data-word="press">Press key</button><button id="up" type="button" data-word="up">Scroll up</button><button id="down" type="button" data-word="down">Scroll down</button></div></fieldset></section>
</main></body></html>
