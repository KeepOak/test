    <section class="ob-main" data-note="ob10"><div class="ob-body"><img class="pose11 ob-pose11" src="assets/branch-work.webp" alt="" loading="lazy" decoding="async" draggable="false"><h2 tabindex="-1">Your first Trunks</h2><p>Pick a few, or tell Branch about your life and work and it proposes them.</p><div class="ob-tr"><button class="ob-tpl" type="button" data-act="ob-tpl" data-i="0" aria-pressed="false"><span class="ob-dot" style="background:#4F6FA8"></span><b>Inbox Manager</b><small>Clears your inbox and drafts replies in your voice</small></button><button class="ob-tpl" type="button" data-act="ob-tpl" data-i="1" aria-pressed="true"><span class="ob-dot" style="background:#D8612A"></span><b>Expense Manager</b><small>Files receipts and builds monthly reports</small></button><button class="ob-tpl" type="button" data-act="ob-tpl" data-i="2" aria-pressed="true"><span class="ob-dot" style="background:#2F8C86"></span><b>Researcher</b><small>Reads the web and writes short briefs with sources</small></button><button class="ob-tpl" type="button" data-act="ob-tpl" data-i="3" aria-pressed="false"><span class="ob-dot" style="background:#56616B"></span><b>Chief of Staff</b><small>Plans your week and chases loose ends</small></button><button class="ob-tpl" type="button" data-act="ob-tpl" data-i="4" aria-pressed="false"><span class="ob-dot" style="background:#B84A6B"></span><b>Bug Reproduction</b><small>Turns a bug report into exact steps</small></button><button class="ob-tpl" type="button" data-act="ob-tpl" data-i="5" aria-pressed="false"><span class="ob-dot" style="background:#8A5AA8"></span><b>Trip Planner</b><small>Finds and books refundable travel</small></button></div><label class="fld" style="margin-top:12px"><span>Or describe what you do</span><textarea class="inp" id="ob-life" rows="2" placeholder="I’m a finance student with a part-time job at Hartwell. I travel a lot."></textarea></label><button class="btn sm" type="button" data-act="ob-propose"><svg class="i s" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v5M12 16v5M3 12h5M16 12h5M6 6l3 3M15 15l3 3M6 18l3-3M15 9l3-3"></path></svg>Let Branch propose Trunks</button></div><footer class="ob-foot"><button class="btn ghost" type="button" data-act="ob-go" data-v="3">Back</button><span class="grow"></span><button class="btn pri" type="button" data-act="ob-next">Continue</button></footer></section></div>
